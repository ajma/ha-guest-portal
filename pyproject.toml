[project]
name = "ha-guest-portal-integration"
version = "0.1.0"
description = "Home Assistant integration for the Guest Portal add-on"
requires-python = ">=3.14.2"

[dependency-groups]
dev = [
    "pytest-homeassistant-custom-component==0.13.366",
    "ruff==0.16.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py314"
line-length = 100
# Ruff's default `include` picks up *.md to format Python fences embedded in
# docs. This repo's markdown is planning/spec transcripts and review notes,
# not source under this project's style — not something CI should gate on.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
