name: Guest Portal
version: 0.0.1
slug: ha_guest_portal
description: >-
  Expose a curated subset of Home Assistant devices to guests via a shared password.
  Designed for short-term rentals and vacation homes.
arch:
  - amd64
  - aarch64
init: false
homeassistant_api: true
# Announces the add-on to the Supervisor so Home Assistant offers the companion
# custom integration. The service name must match manifest.json's domain.
# /discovery* requires no hassio_api privilege.
discovery:
  - ha_guest_portal
# Hybrid ingress setup: Admin access via HA sidebar (ingress), guest access via direct port.
# The ingress port (8099) is used ONLY for admin access from the HA Supervisor and must
# NEVER be published in the ports section below (that would expose passwordless admin to the LAN).
# Guests use the published port (9123) with password authentication.
ingress: true
ingress_port: 8099
ports:
  9123/tcp: 9123
options:
  guest_password: ""
  admin_password: ""
schema:
  guest_password: password
  admin_password: password
