name: Guest Portal
version: 0.0.1
slug: ha_guest_portal
description: >-
  Expose a curated subset of Home Assistant devices to guests via a shared password.
  Designed for short-term rentals and vacation homes.
arch:
  - amd64
  - aarch64
init: false
homeassistant_api: true
# Hybrid ingress setup: Admin access via HA sidebar (ingress), guest access via direct port.
# The ingress port (8099) is used ONLY for admin access from the HA Supervisor and must
# NEVER be published in the ports section below (that would expose passwordless admin to the LAN).
# Guests use the published port (8080) with password authentication.
ingress: true
ingress_port: 8099
ports:
  8080/tcp: 8080
options:
  guest_password: ""
  admin_password: ""
  port: 8080
schema:
  guest_password: password
  admin_password: password
  port: int
