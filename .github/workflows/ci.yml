name: CI

# Push only, deliberately. With `pull_request:` as well, a PR from a branch in
# this repository triggers two runs: the concurrency group keys on github.ref,
# which differs between refs/heads/x and refs/pull/N/merge, so they do not
# cancel each other. Push alone covers every branch, including ones worked on
# without ever opening a PR, which is how this repository is actually used.
#
# The gap is a pull request from a FORK, which no push event here covers. There
# are none today. If outside contributions ever arrive, add `pull_request:`
# back and scope `push:` to the long-lived branches at the same time.
on:
  push:

# Superseded runs are wasted minutes and a confusing queue.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Nothing here writes anything. Checkout needs read; artifact upload uses the
# runner's own token, not this one.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04

    # The whole job runs in the Playwright image, matched to the installed
    # @playwright/test (1.63.0 — verified against
    # node_modules/@playwright/test/package.json, not copied from a document).
    # Browsers and their system libraries are already there, and — the reason
    # that matters here — so are a fixed set of fonts. Three e2e tests are pixel
    # comparisons of the theme previews, tight enough to catch a tile's state
    # colour changing, which is a low-saturation tint. A baseline generated on
    # one font stack and compared against another is a coin toss.
    #
    # Chromium runs as root in here, which is fine: Playwright passes
    # --no-sandbox unless launchOptions sets chromiumSandbox: true, and
    # playwright.config.ts does not.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble

    steps:
      - uses: actions/checkout@v7

      # The image's bundled Node tracks a NODE_VERSION build arg, currently 24
      # but not pinned to a patch and not a promise. The e2e harness spawns the
      # built server, which imports node:sqlite, and package.json requires >=24.
      # Pin it rather than inherit it.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # corepack reads packageManager from package.json and activates pnpm
      # 11.26.0 — the same pnpm this repo is developed with. (The Dockerfile
      # deliberately stays on pnpm 9 and sets COREPACK_ENABLE_PROJECT_SPEC=0 to
      # keep this field from overriding it; that is the image's business, not
      # CI's.) No `cache: pnpm` on setup-node above: pnpm does not exist on PATH
      # until this step has run.
      - name: Enable corepack
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        # Zero warnings, not just zero errors. The repo has held that line and
        # a warning here is how it stops being held.
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm vitest run

      - name: Build
        run: pnpm build

      - name: End-to-end tests
        run: pnpm test:e2e

      # A screenshot comparison that fails in CI is unreadable without the diff
      # image, and without it the temptation is to loosen the tolerance rather
      # than look. Playwright writes <name>-actual/-expected/-diff.png into
      # test-results/ — verified by mutating a baseline locally and watching
      # where the files landed. playwright-report/ is listed for the day someone
      # adds the html reporter; with today's `reporter: 'list'` it is never
      # created, which is why if-no-files-found stays at its default warning
      # rather than erroring.
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  python:
    runs-on: ubuntu-24.04

    # A plain runner, not the Playwright container above: that image exists
    # for its pinned Node/browser/font stack, none of which this job touches,
    # and mixing a second language's toolchain into it would only make that
    # job slower to fail for reasons unrelated to TypeScript.
    steps:
      - uses: actions/checkout@v7

      # uv manages its own Python interpreter, so this needs no separate
      # actions/setup-python. Both inputs are pinned rather than left to
      # "latest": pyproject.toml requires python>=3.14.2, and 0.12.17 /
      # 3.14.6 are the versions this job was verified against locally.
      - uses: astral-sh/setup-uv@v10
        with:
          version: '0.12.17'
          python-version: '3.14.6'

      # --locked on every uv invocation, mirroring `pnpm install
      # --frozen-lockfile` in the check job. Bare `uv run` silently re-resolves
      # and rewrites uv.lock when pyproject.toml has drifted, so CI would pass
      # against a dependency set nobody committed. --locked asserts uv.lock is
      # already up to date with pyproject.toml and fails otherwise.
      #
      # Note --locked, not --frozen: --frozen only skips the re-lock, it does
      # not verify anything. Confirmed against uv 0.12.17 by bumping a pin in
      # pyproject.toml without regenerating the lockfile — `uv run --frozen`
      # exited 0 using the stale lock, `uv run --locked` exited 1 with "The
      # lockfile at `uv.lock` needs to be updated".
      - name: Python tests
        run: uv run --locked pytest

      - name: Ruff check
        run: uv run --locked ruff check

      - name: Ruff format check
        run: uv run --locked ruff format --check

      # No marketplace action here: the common ones bundle their own
      # shellcheck build, which drifts from "current stable" silently. This
      # installs the same v0.11.0 release the scripts were checked against
      # locally.
      #
      # The asset name hardcodes linux.x86_64, which is correct for the
      # `runs-on: ubuntu-24.04` above and silently wrong on any ARM runner —
      # GitHub would serve a 404 HTML body and this step would fail at `tar`,
      # several steps removed from the cause. If the runner ever changes,
      # change this URL and the checksum below with it.
      #
      # The tag alone is not an integrity guarantee: a release asset can be
      # replaced under an existing tag. The digest was computed by downloading
      # this exact asset and running sha256sum over it.
      - name: Install shellcheck
        run: |
          curl -fsSL -o shellcheck.tar.xz "https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz"
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  shellcheck.tar.xz" | sha256sum -c -
          tar -xf shellcheck.tar.xz
          sudo mv shellcheck-v0.11.0/shellcheck /usr/local/bin/shellcheck
          shellcheck --version

      # Every tracked *.sh, not a hardcoded list, so a script added later is
      # gated without anyone remembering to edit this file. git ls-files keeps
      # node_modules/ and dist/ out for free — they are untracked, so the
      # glob cannot reach them. xargs -0r leaves shellcheck unrun (rather than
      # reading stdin) if the set is ever empty, and xargs propagates a
      # non-zero exit from any batch.
      #
      # The two scripts that source a gitignored env file carry an in-file
      # `# shellcheck source=/dev/null` directive rather than this command
      # passing `-e SC1090,SC1091`: the suppression belongs on the line that
      # needs it, and a blanket -e here would also hide those codes in a
      # future script that sources something real.
      - name: Shellcheck
        run: git ls-files -z '*.sh' | xargs -0r shellcheck
